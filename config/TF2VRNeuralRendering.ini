[layer]
enabled=1

[neural_rendering]
; Requires the external NVIDIA NR runtime and compatible driver components.
; Distribution defaults off; tf2vr-nr on enables the prepared local install.
enabled=0
; Model width/height as percent of the full eye dimensions (25..100).
resolution_percent=50
; Neural effect intensity (0..100).
intensity_percent=50
; Lighting/colour response and material detail independently (0..100).
tone_percent=100
detail_percent=100
; Pinned NVIDIA neural rendering model. B preserves the previous appearance.
model=B

[dlaa]
; Experimental native-resolution temporal AA. Requires nvngx_dlss.dll.
; Keep off until the projection/motion test passes on the physical headset.
enabled=0

[frame_generation]
; Experimental 2x OpenXR stereo interpolation. Requires nvngx_dlssg.dll.
; Start the game manually with the headset connected, then use tf2vr-nr fg on.
enabled=0

[capture]
; Allows a CPU-readable snapshot when capture.py requests one.
; Copies are made before releasing images to the runtime.
; Neural rendering, when enabled above, modifies scene HDR before engine post.
enabled=1
first_stereo_frame=0
; Hold two consecutive stereo frames in owned staging copies, then save both.
; 1 = single frame, 2 = temporal diagnostic. Readback never separates the pair.
burst_frames=2
; Record bound-resource descriptions with requested captures. These are not validated guides.
inspect_bindings=1
; Copy the bound depth target and first matching HDR pixel-shader resource.
; Only on request; extra disk usage/stall. Contents and eye association are unvalidated.
capture_candidates=1
; Requested frames only: copy eye-sized depth immediately before its clear.
; Up to 8 extra copies/frame, 32 MiB each. Adds capture stalls/disk usage.
depth_before_clear=0
; Observe main HDR render-target transitions instead of pre-clear capture.
; Keep the latest complete color/depth/motion group per eye release.
; Up to 4 copies of a group per release, 8/frame; all inputs remain unvalidated.
render_passes=1
; Capture at the engine-post binding signature, before its original draw.
; Includes the 1x1 exposure texture; replaces broad render-pass copies.
engine_post=1

[diagnostics]
log_every_frames=600
